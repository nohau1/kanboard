<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон доски (светло‑серый) -->
  <rect x="10" y="10" width="180" height="130" fill="#f0f0f0" stroke="#ccc" stroke-width="2" rx="5"/>
  
  <!-- Разделители колонок (вертикальные линии) -->
  <line x1="70" y1="10" x2="70" y2="140" stroke="#aaa" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="130" y1="10" x2="130" y2="140" stroke="#aaa" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Первая колонка: одна серая карточка (прижата к верху) -->
  <rect x="20" y="25" width="40" height="25" fill="#a0a0a0" stroke="#333" stroke-width="1" rx="3"/>
  
  <!-- Вторая колонка: две красные карточки (прижаты к верху) -->
  <rect x="80" y="25" width="40" height="25" fill="#ff4444" stroke="#333" stroke-width="1" rx="3"/>
  <rect x="80" y="55" width="40" height="25" fill="#ff4444" stroke="#333" stroke-width="1" rx="3"/>
  
  <!-- Третья колонка: три зелёные карточки (прижаты к верху) -->
  <rect x="140" y="25" width="40" height="25" fill="#44aa44" stroke="#333" stroke-width="1" rx="3"/>
  <rect x="140" y="55" width="40" height="25" fill="#44aa44" stroke="#333" stroke-width="1" rx="3"/>
  <rect x="140" y="85" width="40" height="25" fill="#44aa44" stroke="#333" stroke-width="1" rx="3"/>
</svg>

